services:
  client-gateway-epaa:
    image: client-gateway-epaa:production
    build:
      context: ./client-gateway
      dockerfile: dockerfile.prod
      labels:
        com.epaa.project: 'epaa-aa'
        com.epaa.service: 'client-gateway'
        com.epaa.env: 'production'
    restart: unless-stopped
    container_name: client-gateway-epaa
    command:
      [
        'sh',
        '-c',
        'echo "Esperando 15s a que los microservicios creen los topics de Kafka..." && sleep 15 && node dist/main.js'
      ]
    ports:
      - '${GATEWAY_SERVER_PORT_PRODUCTION:-3005}:${GATEWAY_SERVER_PORT_PRODUCTION:-3005}'
    env_file:
      - ./client-gateway/.env.production
      - .env
    networks:
      - epaa-network
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-f',
          'http://localhost:${GATEWAY_SERVER_PORT_PRODUCTION:-3005}/health'
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    volumes:
      - /home/sigepaa/sigepaa/images/readings:/home/sigepaa/sigepaa/images/readings
      - /home/sigepaa/sigepaa/images/connections:/home/sigepaa/sigepaa/images/connections
      - /home/sigepaa/sigepaa/images/qrcodes:/home/sigepaa/sigepaa/images/qrcodes
      - /home/sigepaa/sigepaa/images/work_orders:/home/sigepaa/sigepaa/images/work_orders
      - /home/sigepaa/sigepaa/images/incidents:/home/sigepaa/sigepaa/images/incidents
