# -----------------------------------------------------------------------------
# VOLÚMENES NOMBRADOS — node_modules por servicio
# Estos volúmenes evitan que el bind mount del host sobreescriba los
# node_modules instalados dentro del contenedor (patrón estándar en dev).
# Con labels, pueden ser eliminados de forma selectiva sin afectar otros
# proyectos en el mismo host.
# -----------------------------------------------------------------------------
volumes:
  client-gateway-node-modules:
    labels:
      com.epaa.project: "epaa-aa"
      com.epaa.service: "client-gateway"
      com.epaa.env: "development"
  qrcode-service-node-modules:
    labels:
      com.epaa.project: "epaa-aa"
      com.epaa.service: "qrcode"
      com.epaa.env: "development"
  readings-service-node-modules:
    labels:
      com.epaa.project: "epaa-aa"
      com.epaa.service: "readings"
      com.epaa.env: "development"
  epaa-database-legacy-node-modules:
    labels:
      com.epaa.project: "epaa-aa"
      com.epaa.service: "epaa-database-legacy"
      com.epaa.env: "development"
  #property-service-node-modules:
  clients-service-node-modules:
    labels:
      com.epaa.project: "epaa-aa"
      com.epaa.service: "clients"
      com.epaa.env: "development"
  companies-service-node-modules:
    labels:
      com.epaa.project: "epaa-aa"
      com.epaa.service: "companies"
      com.epaa.env: "development"
  connection-service-node-modules:
    labels:
      com.epaa.project: "epaa-aa"
      com.epaa.service: "connection"
      com.epaa.env: "development"
  #work-orders-service-node-modules:
  #sigame-legacy-node-modules:
  workers-service-node-modules:
    labels:
      com.epaa.project: "epaa-aa"
      com.epaa.service: "workers"
      com.epaa.env: "development"
  security-service-node-modules:
    labels:
      com.epaa.project: "epaa-aa"
      com.epaa.service: "security"
      com.epaa.env: "development"
  location-service-node-modules:
    labels:
      com.epaa.project: "epaa-aa"
      com.epaa.service: "location"
      com.epaa.env: "development"

networks:
  epaa-network-dev:
    external: true
