services:
  kafka-epaa-prod:
    # ─────────────────────────────────────────────────────────────────────
    # IMAGEN FIJA: Nunca usar "latest" en producción. Si Confluent lanza
    # una versión nueva, el contenedor no se actualiza sin tu aprobación.
    # ─────────────────────────────────────────────────────────────────────
    image: confluentinc/cp-kafka:7.7.8
    container_name: kafka-epaa-prod
    restart: unless-stopped

    # ─────────────────────────────────────────────────────────────────────
    # PUERTOS
    #   9192 → EXTERNAL: para clientes dentro de Docker network (microservicios)
    #   9193 → INTERNAL: comunicación interna broker-to-broker (no exponer al host)
    #   9194 → CONTROLLER: solo KRaft controller, nunca al host
    #
    # SEGURIDAD: El puerto 9193 y 9194 NO se publican al host intencionalmente.
    # Los microservicios los alcanzan por la Docker network "epaa-network".
    # Si necesitas acceso externo desde herramientas de admin, usa un bastion
    # host o VPN y abre el 9192 solo en esa interfaz de red específica.
    # ─────────────────────────────────────────────────────────────────────
    ports:
      - '127.0.0.1:9192:9192' # Solo accesible desde el host local, no expuesto a internet

    networks:
      - epaa-network

    # ─────────────────────────────────────────────────────────────────────
    # SEGURIDAD DEL CONTENEDOR
    # ─────────────────────────────────────────────────────────────────────
    user: '1000:1000'
    security_opt:
      - no-new-privileges:true
    read_only: false # Kafka necesita escribir en /var/lib/kafka/data
    cap_drop:
      - ALL              # Eliminar TODOS los capabilities de Linux por defecto
    cap_add:
      - NET_BIND_SERVICE # Solo el mínimo necesario para bindear puertos

    # ─────────────────────────────────────────────────────────────────────
    # LÍMITES DE RECURSOS
    # Heap JVM = 2g, Docker debe tener margen extra para el OS del contenedor
    # ─────────────────────────────────────────────────────────────────────
    mem_limit: 2g
    mem_reservation: 1g
    cpus: '1.5'          # Limitar a 1.5 CPUs es suficiente para un solo nodo
    ulimits:
      nofile:
        soft: 65536
        hard: 131072

    # ─────────────────────────────────────────────────────────────────────
    # VOLÚMENES
    # Named volume gestionado por Docker para máxima durabilidad de datos
    # ─────────────────────────────────────────────────────────────────────
    volumes:
      - kafka-epaa-prod-data:/var/lib/kafka/data

    env_file:
      - .env

    environment:
      ####################################################################
      # KRaft - Modo sin ZooKeeper (moderno y recomendado)
      ####################################################################
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      CLUSTER_ID: ${CLUSTER_ID}
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-epaa-prod:9194'

      ####################################################################
      # LISTENERS
      # Un solo listener PLAINTEXT en 9192 para todos los clientes.
      # En un setup de un solo nodo no se necesita listener inter-broker
      # separado. Tener dos listeners (EXTERNAL+INTERNAL) hace que KafkaJS
      # reciba la metadata con el puerto 9193 y luego intente usarlo,
      # causando el error UNKNOWN_TOPIC_OR_PARTITION.
      # CONTROLLER → KRaft controller (9194), solo interno, nunca sale.
      ####################################################################
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9192,CONTROLLER://0.0.0.0:9194
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-epaa-prod:9192
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      ####################################################################
      # PRODUCCIÓN: Topics y Replicación
      # auto.create = false → Los topics deben crearse explícitamente.
      # Evita topics fantasma por typos en el código de los microservicios.
      ####################################################################
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      ####################################################################
      # RETENCIÓN Y LIMPIEZA DE LOGS
      # 7 días de retención. Segmentos de 512MB para rotación más frecuente
      # y recuperación más rápida ante corrupción de un segmento.
      # max.bytes = 10GB por partición para controlar uso de disco.
      ####################################################################
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 536870912        # 512 MB por segmento
      KAFKA_LOG_RETENTION_BYTES: 10737418240    # 10 GB máximo por partición
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_LOG_CLEANER_ENABLE: 'true'
      KAFKA_LOG_ROLL_HOURS: 24                  # Rotar segmentos cada 24h máximo

      ####################################################################
      # RENDIMIENTO Y MENSAJES
      ####################################################################
      KAFKA_MESSAGE_MAX_BYTES: 52428800             # 50 MB máximo por mensaje
      KAFKA_REPLICA_FETCH_MAX_BYTES: 52428800       # Consistente con message max
      KAFKA_FETCH_MESSAGE_MAX_BYTES: 52428800       # Consistente con message max
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_NUM_NETWORK_THREADS: 4
      KAFKA_NUM_REPLICA_FETCHERS: 2
      KAFKA_COMPRESSION_TYPE: gzip
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 1048576       # 1 MB
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 1048576    # 1 MB
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600     # 100 MB

      ####################################################################
      # PRODUCCIÓN: Durabilidad y Consistencia
      # unclean.leader.election = false → Nunca elevar un broker desactualizado
      # como líder. Prefiere indisponibilidad antes que pérdida de datos.
      ####################################################################
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: 'false'
      KAFKA_MIN_INSYNC_REPLICAS: 1
      # Eliminados flush intervals agresivos para evitar bloqueos de I/O en metadatos
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000  # Esperar antes de rebalanceo

      ####################################################################
      # JVM / GC - G1GC optimizado para baja latencia
      # Heap fijo (Xms=Xmx) para evitar pausas por expansión de memoria
      ####################################################################
      KAFKA_HEAP_OPTS: '-Xms1g -Xmx1g'
      KAFKA_JVM_PERFORMANCE_OPTS: >-
        -XX:MetaspaceSize=128m
        -XX:MaxMetaspaceSize=256m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=20
        -XX:InitiatingHeapOccupancyPercent=35
        -XX:G1HeapRegionSize=16m
        -XX:+ExplicitGCInvokesConcurrent
        -Djava.awt.headless=true

      ####################################################################
      # LOGGING - Solo lo necesario para producción, sin debug noise
      ####################################################################
      KAFKA_LOG4J_LOGGERS: 'kafka=WARN,org.apache.kafka=WARN,kafka.controller=INFO,kafka.log.LogCleaner=INFO,state.change.logger=INFO,kafka.producer.async.DefaultEventHandler=INFO'
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_TOOLS_LOG4J_LOGLEVEL: ERROR

    healthcheck:
      test:
        [
          'CMD',
          'kafka-broker-api-versions',
          '--bootstrap-server',
          'localhost:9192'
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s   # Dar suficiente tiempo a KRaft para inicializarse

#######################################################################
# NETWORKS
#######################################################################
networks:
  epaa-network:
    external: true

#######################################################################
# VOLUMES
#######################################################################
volumes:
  kafka-epaa-prod-data:
    name: kafka-epaa-prod-data
