services:
  kafka-epaa-dev:
    image: confluentinc/cp-kafka:latest
    privileged: true
    container_name: kafka-epaa-dev
    ports:
      - "9192:9092"   # mapeo host → puerto interno estándar para clientes
    env_file:
      - .env.dev
    environment:
      # KRaft mode (sin Zookeeper)
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      CLUSTER_ID: b7c8d9e0f1g23456hijk78   # puedes generar uno nuevo con kafka-storage random-uuid
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-epaa-dev:9093

      # Listeners y advertised (clave para que clientes internos encuentren el broker)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-epaa-dev:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Configuración básica para dev
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_CLEANUP_POLICY: delete

      # Rendimiento básico
      KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g"

    ulimits:
      nofile:
        soft: 65536
        hard: 131072
    mem_limit: 2g
    mem_reservation: 1g
    networks:
      - epaa-network-dev
    volumes:
      - kafka-epaa-data-dev:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  epaa-network-dev:
    external: true

volumes:
  kafka-epaa-data-dev: